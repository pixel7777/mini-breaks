<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Breaks</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app" id="app">

  <header class="topbar">
    <h1>Mini Breaks</h1>
    <nav class="tabs" id="tabs">
      <button class="tab-btn" data-tab="breaks" type="button">Breaks</button>
      <button class="tab-btn" data-tab="news" type="button">News &amp; Shopping</button>
      <button class="tab-btn" data-tab="journal" type="button">Journal</button>
    </nav>
    <div class="topbar-right" id="cloud-status"></div>
  </header>

  <div class="banner" id="banner"></div>

  <!-- ── Breaks ── -->
  <section class="tab-panel" id="tab-breaks">
    <div class="breaks-layout">
      <aside class="sidebar">
        <div class="sidebar-buttons">
          <button id="reset-btn" type="button">Reset checkboxes</button>
          <button id="edit-btn" type="button">Edit</button>
        </div>
        <h2 class="section-heading">Habits</h2>
        <ul class="activities" id="habits"></ul>
        <div id="add-habit-container"></div>
        <h2 class="section-heading">Tasks</h2>
        <div id="tasks-container"></div>
        <div class="sidebar-footer">
          <button class="io-btn" id="export-btn" type="button">Export config</button>
          <button class="io-btn" id="import-btn" type="button">Import config</button>
        </div>
      </aside>
      <main class="main">
        <div class="grid" id="grid"></div>
      </main>
    </div>
  </section>

  <!-- ── News & Shopping ── -->
  <section class="tab-panel" id="tab-news">
    <div class="news-wrap">
      <div class="news-toolbar">
        <h2>News &amp; Shopping</h2>
        <span class="news-generated" id="news-generated"></span>
        <button id="news-edit-btn" class="pill-btn" type="button">Edit topics</button>
      </div>
      <div id="news-content"></div>
    </div>
  </section>

  <!-- ── Journal ── -->
  <section class="tab-panel" id="tab-journal">
    <div class="journal-wrap">
      <div class="journal-nav">
        <button class="nav-btn" id="day-prev" type="button" title="Previous day">‹</button>
        <button class="nav-btn" id="day-next" type="button" title="Next day">›</button>
        <span class="journal-date" id="journal-date"></span>
        <button class="pill-btn" id="today-btn" type="button">Today</button>
        <button class="pill-btn" id="cal-btn" type="button">Calendar</button>
        <button class="pill-btn" id="timeline-btn" type="button">Timeline</button>
        <input type="search" id="journal-search" placeholder="Search entries…">
      </div>
      <div id="cal-container"></div>
      <div id="timeline-container"></div>
      <div id="journal-day"></div>
      <div class="journal-meta-row">
        <button class="io-btn" id="journal-export-btn" type="button">Export journal</button>
        <span class="save-state" id="save-state"></span>
      </div>
    </div>
  </section>

  <div id="toast"></div>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
